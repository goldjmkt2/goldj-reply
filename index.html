<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>골드제이 스레드 답글기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Gowun+Batang:wght@700&display=swap">
<style>
:root{--bg:#f7f5f0;--panel:#fff;--ink:#22201b;--muted:#6f6a5e;--line:#e4dfd3;--gold:#a67c1e;--gold-soft:#f3ead3}
@media (prefers-color-scheme:dark){:root{--bg:#17150f;--panel:#211e17;--ink:#efe9da;--muted:#a59d8a;--line:#38332a;--gold:#d9ae4f;--gold-soft:#3a3120;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:420px;display:grid;gap:16px;text-align:center}
h1{font-family:"Gowun Batang",serif;font-size:26px;margin:0}
h1 span{color:var(--gold)}
p{margin:0;color:var(--muted)}
.go{display:grid;gap:12px;margin-top:8px}
a{display:block;padding:18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;font-size:18px;font-weight:700}
a small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
a:hover,a:focus-visible{border-color:var(--gold);background:var(--gold-soft);outline:none}
</style>
</head>
<body>
<main>
  <h1>골드제이 <span>스레드 답글기</span></h1>
  <p>사용할 버전을 고르세요.</p>
  <div class="go">
    <a href="tw.html">대만 버전<small>번체 중국어 답글</small></a>
    <a href="jp.html">일본 버전<small>일본어 답글</small></a>
  </div>
</main>
</body>
</html>
